version: "3"

services:
  app:
    image: cr.yandex/crp9529k0hh4fpr4apm6/meetings:release-24-12-23-1
    container_name: 'meetings'
    ports:
      - '80:80'
    environment:
      - "SPRING_PROFILES_ACTIVE=prod"
      - "SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/meetings"
      - "OLLAMA_MODERATION_ENABLED=true"
      - "OLLAMA_BASE_URL=http://ollama:11434"
      - "OLLAMA_MODEL=qwen2.5:3b-instruct"
    depends_on:
      - rabbitmq
      - db
      - redis
      - ollama

  # LLM для модерации. На стенде — свой образ с моделью внутри (см. docker/ollama/README.md).
  # Сборка: docker build -f docker/ollama/Dockerfile -t <registry>/meetings-ollama:qwen2.5-3b-instruct .
  # Не монтируйте ollama_data на /root/.ollama — пустой volume скроет модели из образа.
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b-instruct}
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    # Только CPU (без NVIDIA runtime). На слабой машине хватит 1b-модели.
    mem_limit: 8g
    cpus: 4

  rabbitmq:
    image: rabbitmq:3.10.7-management
    container_name: 'rabbitmq'
    hostname: rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=application
      - RABBITMQ_DEFAULT_PASS=12345
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '15672:15672'
      - '5672:5672'

  redis:
    image: redis:latest
    container_name: 'redis'
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - /path/to/local/dаta:/root/redis
      - /path/to/local/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PORT=6379
      - REDIS_DATABASES=16

  db:
    image: postgres:14.1-alpine
    container_name: 'db'
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=meetings
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  app:
  rabbitmq_data:
  db:
